async function sb(path, opts) {
  opts = opts || {};
  var r = await fetch(SB_URL+'/rest/v1/'+path, {
    method: opts.method||'GET',
    headers: {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':opts.prefer||'return=representation'},
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (!r.ok) throw new Error(await r.text());
  var t = await r.text(); return t ? JSON.parse(t) : null;
}

async function load() {

function filter() {
  var s=document.getElementById('srch').value.toLowerCase(),df=document.getElementById('dfrom').value,dt=document.getElementById('dto').value,src=document.getElementById('srcf').value;
  FLT=ALL.filter(function(l){

    if(src==='saved'&&l._src!=='saved')return false; if(src==='historical'&&l._src!=='historical')return false;
    if(s){var h=(l.date+' '+(l.day||'')+' '+(l.user||'')+' '+((l.notes||{}).products86||'')+' '+((l.notes||{}).notesMain||'')+' '+((l.notes||{}).productLows||'')).toLowerCase();if(h.indexOf(s)===-1)return false;}
    return true;
  });
  FLT.sort(function(a,b){var va=SF==='user'?a.user||'':a[SF]||'',vb=SF==='user'?b.user||'':b[SF]||'',c=va<vb?-1:va>vb?1:0;return SD==='desc'?-c:c;});

function sort(f){if(SF===f)SD=SD==='desc'?'asc':'desc';else{SF=f;SD='desc';}
  ['date','day','user'].forEach(function(x){var th=document.getElementById('th-'+x);if(!th)return;th.classList.toggle('active',x===SF);th.querySelector('.sort-arr').textContent=x===SF?(SD==='desc'?'▼':'▲'):'↕';});
  filter();}

function clrFilter(){document.getElementById('srch').value='';document.getElementById('dfrom').value='';document.getElementById('dto').value='';document.getElementById('srcf').value='';filter();}

// ─── RENDER ──────────────────────────────────────────────────
function render() {
  var tb=document.getElementById('tBody'), page=FLT.slice((PG-1)*PS,PG*PS);
  document.getElementById('empty').style.display=FLT.length?'none':'block';
  if(!FLT.length){tb.innerHTML='';return;}
  tb.innerHTML=page.map(function(l){
    var sv=l._src==='saved';
    var p=((l.notes||{}).products86||'').substring(0,50)||'—'; if(p.length>=50)p+='...';
    var n=((l.notes||{}).notesMain||'').substring(0,50)||'—'; if(n.length>=50)n+='...';
    return '<tr>'+
      '<td class="td-date">'+l.date+'</td>'+
      '<td class="td-day">'+(l.day||'')+'</td>'+
      '<td class="td-user'+(sv?'':' hist')+'">'+e(l.user||'—')+'</td>'+
      '<td class="td-notes">'+e(p)+'</td>'+
      '<td class="td-notes">'+e(n)+'</td>'+
      '<td>'+(sv?'<span class="badge b-saved">Saved</span>':'<span class="badge b-excel">Excel</span>')+'</td>'+
      '<td><div class="actions">'+
        '<button class="btn btn-outline btn-sm" onclick=\'view("'+l.date+'")\'>View</button>'+
        '<button class="btn btn-gold btn-sm" onclick=\'edit("'+l.date+'")\'>Edit</button>'+
        (sv?'<button class="btn btn-danger btn-sm" onclick=\'del("'+l.date+'")\'>Delete</button>':'')+
      '</div></td></tr>';
  }).join('');
}

function e(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function pgn(){
  var tot=Math.ceil(FLT.length/PS),p=document.getElementById('pgn');
  if(tot<=1){p.innerHTML='';return;}
  var h='<button class="pg" onclick="go('+(PG-1)+')" '+(PG<=1?'disabled':'')+'>&#8249; Prev</button>';
  var s=Math.max(1,PG-2),en=Math.min(tot,s+4);
  for(var i=s;i<=en;i++)h+='<button class="pg'+(i===PG?' on':'')+'" onclick="go('+i+')">'+i+'</button>';
  h+='<button class="pg" onclick="go('+(PG+1)+')" '+(PG>=tot?'disabled':'')+'>Next &#8250;</button>';
  h+='<span style="font-size:11px;color:#888;margin-left:8px;">Page '+PG+' of '+tot+'</span>';
  p.innerHTML=h;
}
function go(n){PG=n;render();pgn();window.scrollTo(0,0);}
function find(d){for(var i=0;i<ALL.length;i++)if(ALL[i].date===d)return ALL[i];return null;}

// ─── VIEW ────────────────────────────────────────────────────
function view(date){
  var l=find(date);if(!l)return;
  document.getElementById('mTitle').textContent=VENUE+' \u00b7 '+date+(l.day?' ('+l.day+')':'');
  var n=l.notes||{};
  function nr(lbl,val){if(!val||!val.trim())return '';return '<div class="mf"><label>'+lbl+'</label><div style="padding:8px 10px;background:#f9f9f9;border:1px solid #ebebeb;border-radius:4px;font-size:12px;white-space:pre-wrap;">'+e(val)+'</div></div>';}
  var h='<div class="mrow2"><div class="mf"><label>Date</label><input readonly value="'+date+'"></div><div class="mf"><label>Submitted By</label><input readonly value="'+e(l.user||'—')+'"></div></div>';
  h+=nr("Products 86'd",n.products86)+nr('Product Lows',n.productLows)+nr('Service Notes',n.notesMain)+nr('Bar Requests',n.barRequests)+nr('Facility & Maintenance',n.facility)+nr('Broken Glassware',n.brokenGlass)+nr('Other Waste',n.otherWaste);
  if(l._src==='saved'&&l.inventory){
    function is(title,items,inv){if(!inv)return'';var rows=items.map(function(it){var v=(inv[it.name]||'');if(!v)return'';return'<div class="ii"><span class="ii-name">'+it.name+'</span><span class="ii-val">'+v+'</span></div>';}).filter(Boolean);if(!rows.length)return'';return'<div class="msec">'+title+'</div><div class="ig">'+rows.join('')+'</div>';}
    var iv=l.inventory;
    h+=is('WICT',WICT,iv.wict)+is('Juice',JUICE,iv.juice)+is('Mixers',MIXERS,iv.mixers)+is('Prep',PREP,iv.prep)+is('Beer',BEER,iv.beer)+is('Waste',WASTE,iv.waste);
    var br=BATCHES.map(function(bn){var v=(iv.batch||{})[bn]||'';if(!v)return'';return'<div class="ii"><span class="ii-name">'+bn+'</span><span class="ii-val">'+v+'</span></div>';}).filter(Boolean);
    if(br.length)h+='<div class="msec">Batch Log</div><div class="ig">'+br.join('')+'</div>';
  }
  if(l._src==='historical')h+='<div style="margin-top:14px;padding:10px 12px;background:#fdf6ec;border:1px solid #e8c98a;border-radius:4px;font-size:11px;color:#7a5c2e;"><strong>Historical Entry</strong> \u2014 from Excel sheet "'+e(l._ws||'')+'". Inventory not available. Click Edit to add data.</div>';
  document.getElementById('mBody').innerHTML=h;
  document.getElementById('mFoot').innerHTML='<button class="btn btn-outline" onclick="closeM()">Close</button><button class="btn btn-primary" onclick=\'edit("'+date+'")\'>Edit Log</button>';
  openM();
}

// ─── EDIT ────────────────────────────────────────────────────
function edit(date){
  var l=find(date);if(!l)return; EDT=date;
  document.getElementById('mTitle').textContent='Edit Log \u2014 '+date;
  var n=l.notes||{}, iv=l.inventory||{};
  function ta(id,val,ph){return'<textarea id="e_'+id+'" style="min-height:52px;" placeholder="'+(ph||'')+'">'+e(val||'')+'</textarea>';}
  function ii2(sec,name,val,par){var low=par&&parseFloat(val)<par;return'<div class="ii"><span class="ii-name">'+name+'</span><input id="e_'+sec+'_'+name.replace(/[^a-zA-Z0-9]/g,'_')+'" value="'+e(val||'')+'" placeholder="\u2014"'+(low?' class="low"':'')+' onchange="chkP(this,'+par+')"></div>';}
  var h='<div class="mrow2"><div class="mf"><label>Date</label><input readonly value="'+date+'"></div><div class="mf"><label>Submitted By</label><input id="e_user" value="'+e(l.user||'')+'"></div></div>';
  h+='<div class="mf"><label>Products 86\'d</label>'+ta('products86',n.products86)+'</div>';
  h+='<div class="mf"><label>Product Lows</label>'+ta('productLows',n.productLows)+'</div>';
  h+='<div class="mf"><label>Service Notes</label>'+ta('notesMain',n.notesMain)+'</div>';
  h+='<div class="mrow2"><div class="mf"><label>Bar Requests</label>'+ta('barRequests',n.barRequests)+'</div><div class="mf"><label>Facility & Maintenance</label>'+ta('facility',n.facility)+'</div></div>';
  h+='<div class="mrow2"><div class="mf"><label>Broken Glassware</label>'+ta('brokenGlass',n.brokenGlass)+'</div><div class="mf"><label>Other Waste</label>'+ta('otherWaste',n.otherWaste)+'</div></div>';
  function isc(title,items,sec,inv,pars){return'<div class="msec">'+title+'</div><div class="ig">'+items.map(function(it){return ii2(sec,it.name,(inv||{})[it.name],pars&&pars[it.name]);}).join('')+'</div>';}
  var pp={}; PREP.forEach(function(p){pp[p.name]=p.par;});
  h+=isc('WICT',WICT,'wict',iv.wict)+isc('Juice',JUICE,'juice',iv.juice)+isc('Mixers',MIXERS,'mixers',iv.mixers)+isc('Prep',PREP,'prep',iv.prep,pp)+isc('Beer',BEER,'beer',iv.beer)+isc('Waste',WASTE,'waste',iv.waste);
  h+='<div class="msec">Batch Log</div><div class="ig">'+BATCHES.map(function(bn){return ii2('batch',bn,(iv.batch||{})[bn]);}).join('')+'</div>';
  document.getElementById('mBody').innerHTML=h;
  document.getElementById('mFoot').innerHTML='<button class="btn btn-outline" onclick="closeM()">Cancel</button><button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>';
  openM();
}

function chkP(el,par){var v=parseFloat(el.value);el.classList.toggle('low',!isNaN(v)&&v<par);}

async function saveEdit(){
  if(!EDT)return;
  var ex=find(EDT)||{};
  function ri(sec,items){var o={};items.forEach(function(it){var el=document.getElementById('e_'+sec+'_'+it.name.replace(/[^a-zA-Z0-9]/g,'_'));o[it.name]=el?el.value:'';});return o;}
  var pay={venue:VENUE,date:EDT,day:ex.day||'',user_name:document.getElementById('e_user').value.trim()||ex.user||'—',
    notes:{products86:document.getElementById('e_products86').value,productLows:document.getElementById('e_productLows').value,notesMain:document.getElementById('e_notesMain').value,barRequests:document.getElementById('e_barRequests').value,facility:document.getElementById('e_facility').value,brokenGlass:document.getElementById('e_brokenGlass').value,otherWaste:document.getElementById('e_otherWaste').value},
    inventory:{wict:ri('wict',WICT),juice:ri('juice',JUICE),mixers:ri('mixers',MIXERS),prep:ri('prep',PREP),beer:ri('beer',BEER),waste:ri('waste',WASTE),batch:ri('batch',BATCHES.map(function(n){return{name:n};}))},
    saved_at:new Date().toISOString(),deleted:false};
  try{
    await sb('bar_logs?venue=eq.'+encodeURIComponent(VENUE)+'&date=eq.'+EDT,{method:'DELETE',prefer:'return=minimal'});
    await sb('bar_logs',{method:'POST',body:pay,prefer:'return=minimal'});
    closeM();toast('Log saved to Supabase','success');load();
  }catch(err){
    try{localStorage.setItem(LS_PFX+EDT,JSON.stringify(pay));closeM();toast('Saved offline','success');load();}
    catch(e2){toast('Save failed: '+e2.message,'error');}
  }
}

// ─── DELETE ──────────────────────────────────────────────────
function del(date){PDT=date;document.getElementById('delModal').classList.add('open');}
document.getElementById('confirmDel').addEventListener('click',async function(){
  if(!PDT)return;
  try{await sb('bar_logs?venue=eq.'+encodeURIComponent(VENUE)+'&date=eq.'+PDT,{method:'PATCH',body:{deleted:true,deleted_at:new Date().toISOString()},prefer:'return=minimal'});}
  catch(e){localStorage.removeItem(LS_PFX+PDT);}
  PDT=null;document.getElementById('delModal').classList.remove('open');toast('Log deleted','success');load();
});

// ─── MODAL ───────────────────────────────────────────────────
function openM(){document.getElementById('modal').classList.add('open');}
function closeM(){document.getElementById('modal').classList.remove('open');EDT=null;}
function bgClick(ev){if(ev.target===document.getElementById('modal'))closeM();}
function toast(msg,type){var el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(type?' '+type:'');setTimeout(function(){el.className='toast';},3500);}

// ─── INIT ────────────────────────────────────────────────────
load(); sort('date');
</script>
</body>
