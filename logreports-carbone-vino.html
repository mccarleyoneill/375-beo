.log-meta { font-size: 11px; color: #888; margin-top: 3px; }

<div class="main">

    <div class="fg">

    </div>
    <div class="fg">
      <label>Submitted By</label>
      <select id="fUser" onchange="applyFilter()"><option value="">All Staff</option></select>

    <button class="btn btn-outline btn-sm" onclick="clearFilters()" style="align-self:flex-end;">Clear</button>

</div>

async function sb(path, opts) {
  opts = opts || {};
  var r = await fetch(SB_URL + '/rest/v1/' + path, {
    method: opts.method || 'GET',
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': opts.prefer || 'return=representation' },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (!r.ok) throw new Error(await r.text());
  var t = await r.text(); return t ? JSON.parse(t) : null;
}

var WICT   = [{n:'Pellegrino',u:'cs'},{n:'Panna',u:'cs'},{n:'Mixology Ice',u:'bags'},{n:'Espresso Pods',u:'cs'},{n:'Decaf Pods',u:'cs'}];

var MONTH_NAMES = ['','January','February','March','April','May','June','July','August','September','October','November','December'];

var ALL = [], FLT = [], SEL = new Set(), EDT = null, PDT = null;

async function loadLogs() {
  try {
    var rows = await sb('bar_logs?venue=eq.' + encodeURIComponent(VENUE) + '&deleted=eq.false&order=date.desc&limit=2000');
    // Merge: Supabase rows take priority over Excel entries for same date
    var sbDates = new Set((rows||[]).map(function(r){ return r.date; }));
    var excelOnly = EXCEL_LOGS.filter(function(l){ return !sbDates.has(l.date); });
    ALL = (rows || []).concat(excelOnly.map(function(l){
      return { date:l.date, day:l.day, user_name:l.user_name, venue:l.venue,
               notes:l.notes, inventory:l.inventory, _source:'excel', _sheet:l._sheet };
    }));
    document.getElementById('syncDot').className = 'sync-dot green';
    document.getElementById('syncLabel').textContent = ALL.length + ' logs \u00b7 synced';

    var years = [...new Set(ALL.map(function(l){ return l.date.substring(0,4); }))].sort().reverse();
    var ysel = document.getElementById('fYear');
    years.forEach(function(y){ var o = document.createElement('option'); o.value = y; o.textContent = y; ysel.appendChild(o); });

    var users = [...new Set(ALL.map(function(l){ return l.user_name||''; }).filter(Boolean))].sort();
    var usel = document.getElementById('fUser');
    users.forEach(function(u){ var o = document.createElement('option'); o.value = u; o.textContent = u; usel.appendChild(o); });

    var now = new Date();
    document.getElementById('fMonth').value = String(now.getMonth()+1).padStart(2,'0');
    document.getElementById('fYear').value  = String(now.getFullYear());
    applyFilter();
  } catch(e) {
    document.getElementById('syncDot').className = 'sync-dot amber';
    document.getElementById('syncLabel').textContent = 'Offline — showing Excel history';
    ALL = EXCEL_LOGS.map(function(l){
      return { date:l.date, day:l.day, user_name:l.user_name, venue:l.venue,
               notes:l.notes, inventory:l.inventory, _source:'excel', _sheet:l._sheet };
    });
  }
}

function applyFilter() {
  var month = document.getElementById('fMonth').value;
  var year  = document.getElementById('fYear').value;
  var user  = document.getElementById('fUser').value;
  FLT = ALL.filter(function(l) {
    if (month && l.date.substring(5,7) !== month) return false;
    if (year  && l.date.substring(0,4) !== year)  return false;
    if (user  && (l.user_name||'') !== user)       return false;
    return true;
  });
  var lbl = [month ? MONTH_NAMES[parseInt(month)] : '', year].filter(Boolean).join(' ');
  document.getElementById('filterMeta').textContent = FLT.length + ' log' + (FLT.length!==1?'s':'') + (lbl?' \u2014 '+lbl:'');
  SEL.clear(); renderList();
}

function clearFilters() {
  document.getElementById('fMonth').value = '';
  document.getElementById('fYear').value  = '';
  document.getElementById('fUser').value  = '';
  applyFilter();
}

function renderList() {
  var list = document.getElementById('logList');
  var sbar = document.getElementById('selectBar');
  if (FLT.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">&#128203;</div><p>No logs found for this period.</p></div>';
    sbar.style.display = 'none'; updateActionBar(); return;
  }
  sbar.style.display = 'flex';
  document.getElementById('selectInfo').textContent = FLT.length + ' log' + (FLT.length!==1?'s':'');
  document.getElementById('selectAll').checked = SEL.size === FLT.length && FLT.length > 0;

  var groups = {}, order = [];
  FLT.forEach(function(l) {
    var k = l.date.substring(0,7);
    if (!groups[k]) { groups[k] = []; order.push(k); }
    groups[k].push(l);
  });

  var html = '';
  order.forEach(function(k) {
    var parts = k.split('-');
    html += '<div class="month-divider">' + MONTH_NAMES[parseInt(parts[1])] + ' ' + parts[0] + ' &mdash; ' + groups[k].length + ' log' + (groups[k].length!==1?'s':'') + '</div>';
    groups[k].forEach(function(l) {
      var sel = SEL.has(l.date);
      var n   = l.notes || {};
      var note = (n.notesMain || n.products86 || '').trim();
      if (note.length > 90) note = note.substring(0,90) + '\u2026';
      html += '<div class="log-card' + (sel?' selected':'') + '" id="card_' + l.date + '">';
      html += '<div class="log-card-row">';
      html += '<input type="checkbox" ' + (sel?'checked':'') + ' onchange="toggleSel(event,\'' + l.date + '\')" onclick="event.stopPropagation()">';
      html += '<div class="log-info" onclick="viewLog(\'' + l.date + '\')">';
      html += '<div><span class="log-date">' + l.date + '</span><span class="log-day">' + (l.day||'') + '</span></div>';
      html += '<div class="log-meta">Submitted by <strong>' + e(l.user_name||'\u2014') + '</strong></div>';
      if (note) html += '<div class="log-note">' + e(note) + '</div>';
      html += '</div>';
      html += '<div class="log-actions">';
      html += '<button class="btn btn-outline btn-sm" onclick="viewLog(\'' + l.date + '\');event.stopPropagation()">View</button>';
      html += '<button class="btn btn-gold btn-sm" onclick="editLog(\'' + l.date + '\');event.stopPropagation()">Edit</button>';
      if (l._source !== 'excel') html += '<button class="btn btn-danger btn-sm" onclick="promptDel(\'' + l.date + '\',true);event.stopPropagation()">Delete</button>';
      if (l._source === 'excel') html += '<span style="font-size:9px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:#eef3ff;color:#3366cc;border:1px solid #b3c6ff;padding:2px 7px;border-radius:3px;">Excel</span>';
      html += '</div></div></div>';
    });
  });
  list.innerHTML = html;
  updateActionBar();
}

function e(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toggleSel(ev, date) {
  if (SEL.has(date)) SEL.delete(date); else SEL.add(date);
  var card = document.getElementById('card_' + date);
  if (card) card.className = 'log-card' + (SEL.has(date)?' selected':'');
  document.getElementById('selectAll').checked = SEL.size === FLT.length && FLT.length > 0;
  updateActionBar();
}
function toggleSelectAll(checked) { SEL.clear(); if (checked) FLT.forEach(function(l){ SEL.add(l.date); }); renderList(); }
function clearSelection() { SEL.clear(); renderList(); }
function updateActionBar() {
  var n = SEL.size;
  document.getElementById('actionBar').className = 'action-bar' + (n>0?' show':'');
  document.getElementById('actionCount').textContent = n + ' log' + (n!==1?'s':'') + ' selected';
}

function find(date) { return ALL.find(function(l){ return l.date === date; }) || null; }

// ── VIEW ─────────────────────────────────────────────────
function viewLog(date) {
  var l = find(date); if (!l) return;
  var n = l.notes || {}, inv = l.inventory || {};
  document.getElementById('modalTitle').textContent = VENUE + ' \u00b7 ' + date + (l.day ? ' (' + l.day + ')' : '');
  function nr(lbl, val) {
    if (!val||!val.trim()) return '';
    return '<div class="mf"><label>' + lbl + '</label><div style="padding:8px 10px;background:#f9f9f9;border:1px solid #ebebeb;border-radius:4px;font-size:12px;white-space:pre-wrap;">' + e(val) + '</div></div>';
  }
  var html = '<div class="mrow"><div class="mf"><label>Date</label><input readonly value="' + date + '"></div>';
  html += '<div class="mf"><label>Submitted By</label><input readonly value="' + e(l.user_name||'\u2014') + '"></div></div>';
  html += nr("Products 86'd",n.products86)+nr('Product Lows',n.productLows)+nr('Service Notes',n.notesMain)+nr('Bar Requests',n.barRequests)+nr('Facility & Maintenance',n.facility)+nr('Broken Glassware',n.brokenGlass)+nr('Other Waste',n.otherWaste);
  function iSec(title, items, obj) {
    if (!obj) return '';
    var rows = items.map(function(it){ var v=(obj[it.n]||''); if(!v) return ''; return '<div class="inv-item"><span class="inv-name">'+it.n+'</span><span class="inv-val">'+v+'</span></div>'; }).filter(Boolean);
    return rows.length ? '<div class="msec">'+title+'</div><div class="inv-grid">'+rows.join('')+'</div>' : '';
  }
  html += iSec('WICT',WICT,inv.wict)+iSec('Juice',JUICE,inv.juice)+iSec('Mixers',MIXERS,inv.mixers)+iSec('Prep',PREP,inv.prep)+iSec('Beer',BEER,inv.beer)+iSec('Waste',WASTE,inv.waste);
  var br = BATCHES.map(function(bn){ var v=(inv.batch||{})[bn]||''; return v?'<div class="inv-item"><span class="inv-name">'+bn+'</span><span class="inv-val">'+v+'</span></div>':''; }).filter(Boolean);
  if (br.length) html += '<div class="msec">Batch Log</div><div class="inv-grid">'+br.join('')+'</div>';
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalFooter').innerHTML = '<button class="btn btn-outline" onclick="closeModal()">Close</button><button class="btn btn-gold" onclick="editLog(\''+date+'\')">Edit Log</button>';
  openModal();
}

// ── EDIT ─────────────────────────────────────────────────
function editLog(date) {
  var l = find(date); if (!l) return;
  EDT = date;
  var n = l.notes||{}, inv = l.inventory||{};
  document.getElementById('modalTitle').textContent = 'Edit Log \u2014 ' + date;
  function ta(id,val,ph){ return '<textarea id="e_'+id+'" style="min-height:52px;" placeholder="'+(ph||'')+'">'+e(val||'')+'</textarea>'; }
  function ii(sec,name,val,par){ var low=par&&parseFloat(val)<par; return '<div class="inv-item"><span class="inv-name">'+name+'</span><input id="e_'+sec+'_'+name.replace(/[^a-zA-Z0-9]/g,'_')+'" value="'+e(val||'')+'" placeholder="\u2014"'+(low?' class="low"':'')+' onchange="chkP(this,'+par+')"></div>'; }
  var html = '<div class="mrow"><div class="mf"><label>Date</label><input readonly value="'+date+'"></div><div class="mf"><label>Submitted By</label><input id="e_user" value="'+e(l.user_name||'')+'"></div></div>';
  html += '<div class="mf"><label>Products 86\'d</label>'+ta('products86',n.products86)+'</div>';
  html += '<div class="mf"><label>Product Lows</label>'+ta('productLows',n.productLows)+'</div>';
  html += '<div class="mf"><label>Service Notes</label>'+ta('notesMain',n.notesMain)+'</div>';
  html += '<div class="mrow"><div class="mf"><label>Bar Requests</label>'+ta('barRequests',n.barRequests)+'</div><div class="mf"><label>Facility & Maintenance</label>'+ta('facility',n.facility)+'</div></div>';
  html += '<div class="mrow"><div class="mf"><label>Broken Glassware</label>'+ta('brokenGlass',n.brokenGlass)+'</div><div class="mf"><label>Other Waste</label>'+ta('otherWaste',n.otherWaste)+'</div></div>';
  function iSec(title,items,sec,obj,pars){ return '<div class="msec">'+title+'</div><div class="inv-grid">'+items.map(function(it){ return ii(sec,it.n,(obj||{})[it.n],pars&&pars[it.n]); }).join('')+'</div>'; }
  var pp={}; PREP.forEach(function(p){pp[p.n]=p.par;});
  html += iSec('WICT',WICT,'wict',inv.wict)+iSec('Juice',JUICE,'juice',inv.juice)+iSec('Mixers',MIXERS,'mixers',inv.mixers)+iSec('Prep',PREP,'prep',inv.prep,pp)+iSec('Beer',BEER,'beer',inv.beer)+iSec('Waste',WASTE,'waste',inv.waste);
  html += '<div class="msec">Batch Log</div><div class="inv-grid">'+BATCHES.map(function(bn){ return ii('batch',bn,(inv.batch||{})[bn]); }).join('')+'</div>';
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalFooter').innerHTML = '<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-gold" onclick="saveEdit()">Save Changes</button>';
  openModal();
}

function chkP(el,par){ var v=parseFloat(el.value); el.classList.toggle('low',!isNaN(v)&&v<par); }

async function saveEdit() {
  if (!EDT) return;
  var ex = find(EDT)||{};
  function ri(sec,items){ var o={}; items.forEach(function(it){ var el=document.getElementById('e_'+sec+'_'+it.n.replace(/[^a-zA-Z0-9]/g,'_')); o[it.n]=el?el.value:''; }); return o; }
  var pay = {
    venue:VENUE, date:EDT, day:ex.day||'',
    user_name: document.getElementById('e_user').value.trim()||ex.user_name||'\u2014',
    notes:{ products86:document.getElementById('e_products86').value, productLows:document.getElementById('e_productLows').value, notesMain:document.getElementById('e_notesMain').value, barRequests:document.getElementById('e_barRequests').value, facility:document.getElementById('e_facility').value, brokenGlass:document.getElementById('e_brokenGlass').value, otherWaste:document.getElementById('e_otherWaste').value },
    inventory:{ wict:ri('wict',WICT), juice:ri('juice',JUICE), mixers:ri('mixers',MIXERS), prep:ri('prep',PREP), beer:ri('beer',BEER), waste:ri('waste',WASTE), batch:ri('batch',BATCHES.map(function(n){return{n:n};})) },
    saved_at:new Date().toISOString(), deleted:false
  };
  try {
    await sb('bar_logs?venue=eq.'+encodeURIComponent(VENUE)+'&date=eq.'+EDT,{method:'DELETE',prefer:'return=minimal'});
    await sb('bar_logs',{method:'POST',body:pay,prefer:'return=minimal'});
    var idx = ALL.findIndex(function(l){ return l.date===EDT; });
    if (idx>=0) ALL[idx]=pay; else ALL.push(pay);
    closeModal(); toast('Log saved','ok'); applyFilter();
  } catch(err){ toast('Save failed: '+err.message,'err'); }
}

// ── DELETE ────────────────────────────────────────────────
function promptDel(date, single) {
  PDT = single ? [date] : Array.from(SEL);
  var n = PDT.length;
  document.getElementById('delMsg').textContent = 'Delete '+(n>1?n+' logs':'this log')+'? This cannot be undone.';
  document.getElementById('delOverlay').classList.add('open');
}
function deleteSelected() { if (!SEL.size){toast('No logs selected','err');return;} promptDel(null,false); }
document.getElementById('confirmDelBtn').addEventListener('click', async function() {
  if (!PDT||!PDT.length) return;
  try {
    for (var i=0;i<PDT.length;i++) await sb('bar_logs?venue=eq.'+encodeURIComponent(VENUE)+'&date=eq.'+PDT[i],{method:'PATCH',body:{deleted:true,deleted_at:new Date().toISOString()},prefer:'return=minimal'});
    var d=new Set(PDT); ALL=ALL.filter(function(l){return!d.has(l.date);}); SEL.clear(); PDT=null;
    document.getElementById('delOverlay').classList.remove('open');
    toast(d.size+' log'+(d.size>1?'s':'')+' deleted','ok'); applyFilter();
  } catch(err){ toast('Delete failed: '+err.message,'err'); }
});

function openModal()  { document.getElementById('modalOverlay').classList.add('open'); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); EDT=null; }
function bgClick(ev)  { if (ev.target===document.getElementById('modalOverlay')) closeModal(); }
function toast(msg,type){ var el=document.getElementById('toast'); el.textContent=msg; el.className='toast show'+(type?' '+type:''); setTimeout(function(){el.className='toast';},3500); }

loadLogs();
